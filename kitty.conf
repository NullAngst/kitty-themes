# kitty.conf
#
# Settings live in other.conf. Colors live in the active theme.
#
# Switch themes with ctrl+shift+f12, or run:
#   kitty +kitten themes
# The custom themes sit in themes/ next to this file and show up in the
# picker under "User".

include other.conf

# The themes kitten rewrites the block below when you pick a theme.
# Keep it last so the theme's colors win over anything above it.
# BEGIN_KITTY_THEME
# Modern Dark
include current-theme.conf
# END_KITTY_THEME
