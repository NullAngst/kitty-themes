# other.conf
#
# Everything except colors. Colors come from the theme include at the
# bottom of kitty.conf, so any color you set here gets overridden.
#
# Reload after editing with ctrl+shift+f5, or restart kitty.
# Run `kitty --debug-config` to see what kitty actually loaded.


# ---- Fonts -------------------------------------------------------------

# kitty 0.33+ ships Nerd Font symbols built in, so you do not need a
# patched "NF" font for icons. Plain Hasklig renders the same as Hasklug NF.
font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Examples, swap one in for the font_family line above:
# font_family      Hasklig
# font_family      JetBrains Mono
# font_family      Fira Code

# never, always, or cursor (splits ligatures only under the cursor)
disable_ligatures never

# Extra line spacing, e.g. 110%
# modify_font cell_height 110%


# ---- Cursor ------------------------------------------------------------

# block, beam, or underline
cursor_shape          beam
cursor_beam_thickness 1.5

# Seconds per blink. 0 disables blinking, -1 follows the system setting.
cursor_blink_interval      0.5
cursor_stop_blinking_after 15.0

# Animated trail when the cursor jumps. Needs kitty 0.37+. 0 is off.
# cursor_trail 3


# ---- Scrollback --------------------------------------------------------

scrollback_lines 10000

# Extra history in MB kept for the pager (ctrl+shift+h). 0 disables it.
scrollback_pager_history_size 0


# ---- Mouse, clipboard, URLs -------------------------------------------

mouse_hide_wait 3.0

# none, straight, double, curly, dotted, dashed
url_style     curly
open_url_with default
detect_urls   yes

# "no" keeps the normal behavior. "clipboard" copies whatever you select.
copy_on_select no

# smart strips trailing spaces from copied text unless it looks like a
# rectangle selection
strip_trailing_spaces smart


# ---- Bell --------------------------------------------------------------

enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell yes


# ---- Window ------------------------------------------------------------

remember_window_size  yes
# Used only when remember_window_size is no. "c" means cells.
initial_window_width  100c
initial_window_height 30c

window_padding_width 6
placement_strategy   center

# yes removes the titlebar entirely
hide_window_decorations no

# -1 asks only when something besides the shell is running,
# 0 never asks, N asks when N or more windows are open
confirm_os_window_close -1

# Wayland titlebar color: system, background, or a hex color.
# "background" makes the titlebar match the active theme.
wayland_titlebar_color background


# ---- Transparency ------------------------------------------------------

# 1.0 is fully opaque.
background_opacity 1.0

# Blur behind a transparent window. KDE Plasma and macOS only, kitty 0.32+.
# Does nothing unless background_opacity is below 1.0.
background_blur 0

# Lets you change opacity live: ctrl+shift+a then m (more) or l (less)
dynamic_background_opacity yes


# ---- Tab bar -----------------------------------------------------------

# top or bottom
tab_bar_edge bottom

# fade, slant, separator, powerline, or hidden
tab_bar_style powerline
# angled, slanted, or round (powerline style only)
tab_powerline_style slanted

# Hide the tab bar until there are this many tabs
tab_bar_min_tabs 2

tab_title_template      "{index}: {title}"
active_tab_font_style   bold
inactive_tab_font_style normal


# ---- Layouts -----------------------------------------------------------

# First one listed is the default. Cycle with ctrl+shift+l.
enabled_layouts splits,stack,tall,grid


# ---- Shell -------------------------------------------------------------

# "." means use your login shell
# shell .
shell_integration enabled


# ---- Performance -------------------------------------------------------

repaint_delay   10
input_delay     3
sync_to_monitor yes


# ---- Remote control ----------------------------------------------------

# Off by default. The theme picker reloads kitty with a signal, so it
# does not need this.
allow_remote_control no


# ---- Keys --------------------------------------------------------------

# kitty_mod is ctrl+shift unless you change it here
# kitty_mod ctrl+shift

# Open the theme picker in an overlay
map kitty_mod+f12 launch --type=overlay kitty +kitten themes

# New windows and tabs open in the current directory
# (needs shell_integration)
map kitty_mod+enter launch --cwd=current
map kitty_mod+t     new_tab_with_cwd
